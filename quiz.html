      {q:"What is the 'Overlay' network driver used for?",options:["Connecting containers on the same single host","Connecting containers across multiple Docker hosts (multi-host clustering)","Disabling container network connectivity","Mapping container ports to localhost interfaces"],answer:1,explanation:"Overlay networks span multiple Docker hosts, enabling container-to-container communication across nodes in Docker Swarm or Kubernetes."},
      {q:"Which command is used to authenticate with a Docker registry?",options:["docker login","docker connect","docker auth","docker signin"],answer:0,explanation:"docker login authenticates to a registry. Credentials are stored in ~/.docker/config.json."},
      {q:"To push to a third-party registry like AWS ECR, what is typically required?",options:["Upgrading the Docker daemon to enterprise version","Authentication and tagging the image with the full registry URL","Running containers in Host network mode","Disabling all internal container ports"],answer:1,explanation:"You must docker login to the registry and tag the image with the full registry URL prefix before pushing."},
      {q:"What happens if you EXPOSE a port in a Dockerfile but do not publish it with `-p` at runtime?",options:["The container fails to start","The service is accessible only from inside the container or by containers on the same Docker network","The port is mapped to a random host port automatically","The container network blocks all outbound calls"],answer:1,explanation:"EXPOSE without -p means the port is available within Docker networks but is not mapped to the host machine."},
      {q:"Which command cleans up unused local volumes?",options:["docker volume rmi","docker volume clean","docker volume prune","docker volume remove-all"],answer:2,explanation:"docker volume prune removes all volumes not referenced by any container — frees disk space safely."},
      {q:"How do you limit CPU and memory usage for a running container?",options:["Using --memory and --cpus flags with docker run (Container Resource Management)","Container Networking flags","Docker Volume configuration","Registry Management settings"],answer:0,explanation:"Resource constraints are set at docker run with --memory=512m --cpus=1.0, or in Compose under deploy.resources.limits."}
    ]
  },
  M08: {
    title: "CI/CD with GitHub Actions",
    questions: [
      {q:"What are GitHub Actions primarily used for?",options:["To manage database architectures","To automate tasks, set up CI/CD, and deploy code directly from repositories","To act as a primary web hosting service","To manually review errors"],answer:1,explanation:"GitHub Actions is a platform for automating workflows — CI pipelines, deployments, and any event-driven automation."},
      {q:"A job in GitHub Actions consists of:",options:["Only One Step","Multiple Jobs running in parallel","A series of individual Steps executed sequentially on the same runner","Only a single shell script"],answer:2,explanation:"A Job is made up of Steps that run sequentially on the same runner instance, sharing a workspace."},
      {q:"Where are workflow files stored in a repository?",options:[".github/workflows/",".github/work","github/workflows/","workflows/"],answer:0,explanation:"Workflow YAML files must live in .github/workflows/ to be recognised and run by GitHub Actions."},
      {q:"If a workflow runs a job on Ubuntu, Windows, and macOS simultaneously, how are they executed by default?",options:["Sequentially","In parallel","Alphabetically","Manually triggered one by one"],answer:1,explanation:"Jobs without `needs:` dependencies run in parallel across their respective runners simultaneously."},
      {q:"What is a 'Runner' in GitHub Actions?",options:["A script that checks for syntax errors","A directory where workflows are stored","A set of pre-defined objects","A server (VM) that listens for jobs and executes workflow steps"],answer:3,explanation:"A Runner is a server that listens for jobs, executes workflow steps, and reports results back to GitHub."},
      {q:"Which of the following is true of GitHub-hosted runners?",options:["You must manually manage each VM","They allow you to run multiple jobs on the same VM indefinitely","They provide a fresh, clean instance for every single job run","You can install permanent system-level changes to the base OS"],answer:2,explanation:"GitHub-hosted runners are ephemeral — each job gets a clean VM, ensuring reproducibility and isolation."},
      {q:"When would you use the `workflow_dispatch` trigger event?",options:["When a pull request is created","When you want to manually trigger the workflow on demand","When an issue is updated","When code is merged to the main branch"],answer:1,explanation:"workflow_dispatch adds a 'Run workflow' button in the GitHub UI for manual, on-demand execution with optional inputs."},
      {q:"Which event triggers a workflow on every commit push or tag?",options:["When a pull request is merged","When a commit or tag is pushed to the repository (`push`)","When an issue is created","When workflow_dispatch is clicked"],answer:1,explanation:"on: push triggers the workflow whenever commits or tags are pushed to the matching branches/patterns."},
      {q:"In GitHub Actions, what does the `schedule` event with cron syntax control?",options:["It runs the workflow only on weekends","It triggers the workflow at specified recurring time intervals","It runs the workflow once every year","It triggers the workflow only once when first created"],answer:1,explanation:"on: schedule with cron expressions enables time-based triggers, e.g. '0 2 * * *' runs at 2am UTC daily."},
      {q:"What typically happens when you push code to a repository with a workflow configured with `on: push`?",options:["The workflow is automatically triggered","GitHub deletes the repository","The repository is forked automatically","Nothing happens unless triggered manually"],answer:0,explanation:"Push events automatically trigger matching workflows — this is the foundation of Continuous Integration automation."},
      {q:"What are 'Steps' in the context of a GitHub Actions job?",options:["They define the operating system for the job","They trigger the workflow","Individual tasks executed sequentially within a job — each step runs a command or a reusable Action","They define environment variables for the repository"],answer:2,explanation:"Steps are the atomic units of work in a job — shell commands (`run:`) or Actions (`uses:`)."},
      {q:"Which statement correctly describes advantages of GitHub Actions?",options:["You must manually set up and scale servers for your workflows","GitHub Actions only works on local machines","You cannot get reports or job status from GitHub Actions","GitHub manages infrastructure, executes jobs, provides logs, artifacts, and reports"],answer:3,explanation:"GitHub Actions provides fully managed runners, logs, artifact storage, and status badges without any infrastructure management."},
      {q:"What is the advantage of self-hosted runners?",options:["You don't have to manage any infrastructure","You can install any software and fully control the hardware and environment","You cannot run multiple jobs on the same runner","macOS runners are hosted on GitHub's servers"],answer:1,explanation:"Self-hosted runners give you custom hardware, GPU support, private network access, and pre-installed software control."},
      {q:"Where are GitHub-hosted runners for Linux, Windows, and macOS hosted?",options:["Linux and Windows on Azure, macOS on GitHub macOS cloud","Linux and Windows on GitHub cloud, macOS on Azure","All runners on self-managed servers","All runners on AWS EC2"],answer:0,explanation:"GitHub uses Microsoft Azure for Linux/Windows runners and their own macOS cloud infrastructure for macOS runners."},
      {q:"Which operation is NOT supported on GitHub-hosted runners?",options:["Running jobs automatically on push events","Using YAML-based workflow configuration","Installing system-level software permanently (OS changes persist after the job)","Receiving job logs and downloading artifacts"],answer:2,explanation:"Hosted runners are ephemeral — any OS changes are lost after the job. Use self-hosted runners for persistent tooling."},
      {q:"In `workflow_dispatch`, why do we define `inputs`?",options:["To auto-detect the deployment environment","To allow users to select or type values when manually triggering the workflow","To permanently store sensitive keys","To restrict branch creation"],answer:1,explanation:"Inputs create form fields in the GitHub UI that users fill out when clicking 'Run workflow'."},
      {q:"What is the purpose of using `actions/checkout@v4` as a step?",options:["Installs project dependencies","Creates a new branch before deployment","Checks out the repository under $GITHUB_WORKSPACE so subsequent steps can access the code","Deploys the application to the production server"],answer:2,explanation:"Without actions/checkout, the runner has no access to your repository code. This is almost always the very first step."},
      {q:"What are artifacts in GitHub Actions?",options:["Permanently stored source code backups","Files (like build outputs or test reports) saved and shared between jobs in a workflow run","Triggers for another workflow","Automatic branch merge confirmations"],answer:1,explanation:"Artifacts (via actions/upload-artifact / actions/download-artifact) persist files between jobs and allow downloading build outputs."},
      {q:"What is the primary benefit of GitHub Environments?",options:["To create new branches automatically","To execute workflows on local operating systems","To protect deployments with environment-specific secrets and manual approval gates","To share files between jobs"],answer:2,explanation:"Environments add protection rules — required reviewers must approve before a job targeting that environment can run."},
      {q:"What is the main purpose of a lint job in a production pipeline?",options:["Run code quality and syntax checks before building or testing","Build the Docker image","Run unit tests","Deploy the application to production"],answer:0,explanation:"Linting catches syntax errors and style violations early — fast feedback before expensive build and test steps."},
      {q:"Why are `if:` conditional expressions used on a job or step?",options:["To speed up workflow execution automatically","To define manual inputs","To run a step only on specific branches","To control whether a job or step runs based on evaluated conditions"],answer:3,explanation:"Conditions like `if: github.ref == 'refs/heads/main'` control exactly when jobs and steps execute."},
      {q:"What is the role of Matrix Strategy in GitHub Actions?",options:["To run a single job across predefined combinations of variables (e.g. multiple OS and Node versions)","To create separate repos for each operating system","To limit the total number of workflow runs","To deploy applications to multiple servers sequentially"],answer:0,explanation:"Matrix strategy generates multiple parallel job runs from variable combinations — perfect for cross-platform and multi-version testing."},
      {q:"What is the main advantage of using OIDC (OpenID Connect) with AWS in GitHub Actions?",options:["To permanently store AWS access keys in repository secrets","To authenticate securely with AWS without storing long-lived static credentials","To increase Docker build speed","To create IAM users automatically"],answer:1,explanation:"OIDC federation lets GitHub Actions assume an AWS IAM role using short-lived tokens — no static access keys needed."},
      {q:"In GitHub Actions, why is the `needs` keyword used?",options:["To run workflows only on one branch","To define job dependencies and run jobs in sequence","To automatically merge pull requests","To store secrets"],answer:1,explanation:"needs: [job-a, job-b] makes a job wait until all listed jobs complete successfully before it starts."},
      {q:"Which trigger/event makes a workflow callable from other workflows (reusable)?",options:["push","workflow_dispatch","workflow_call","pull_request"],answer:2,explanation:"on: workflow_call makes a workflow reusable — other workflows can call it with inputs and receive outputs."},
      {q:"What is the purpose of the `concurrency` key in a workflow?",options:["To store workflow logs","To speed up Docker image builds","To run multiple jobs in parallel","To limit or cancel in-progress runs to prevent conflicts and overlapping deployments"],answer:3,explanation:"concurrency groups ensure only one run per group proceeds. cancel-in-progress: true cancels older in-flight runs."},
      {q:"How do you target a self-hosted runner in a workflow?",options:["runs-on: ubuntu-latest","runs-on: github-hosted","runs-on: self-hosted (or with labels like [self-hosted, linux])","runs-on: ec2"],answer:2,explanation:"The self-hosted label routes the job to your own runner machines registered with the repository or organisation."},
      {q:"What is the primary role of the `env` context in GitHub Actions?",options:["Store encrypted sensitive values","Store environment variables defined at the workflow, job, or step level","Automatically rotate access tokens","Store AWS secrets"],answer:1,explanation:"env: defines environment variables accessible via ${{ env.VAR_NAME }} at the workflow, job, or step scope."},
      {q:"What is a common reason why jobs are not being picked up by a self-hosted runner?",options:["Git is not installed on the runner","Ubuntu is not fully updated","SSH keys are missing","Incorrect runs-on label — the job labels do not match the runner's registered labels"],answer:3,explanation:"If the runs-on labels do not match the runner's registered labels, the job will remain queued indefinitely."},
      {q:"What is the primary aim of the `secrets` context?",options:["Store sensitive data like passwords, API keys, and tokens securely so they are never exposed in logs","Store public configuration values","Store temporary build variables","Store repository file paths"],answer:0,explanation:"${{ secrets.KEY }} provides access to encrypted repository or organisation secrets — they are masked in all log output."}
    ]
  },

    questions: [
      {q:"What is the primary principle behind 'Shift Left' security?",options:["Move security testing to the end of the pipeline","Move security testing earlier in the development lifecycle","Eliminate all security testing from the pipeline","Only test security in production"],answer:1,explanation:"Shifting left moves security to the start of the SDLC — catching vulnerabilities when they are cheapest to fix."},
      {q:"How does a DevSecOps pipeline differ from a traditional DevOps pipeline?",options:["DevSecOps skips the build stage","Security is embedded at every stage rather than bolted on at the end","DevSecOps only runs on self-hosted runners","There is no difference — they are the same"],answer:1,explanation:"DevSecOps integrates security gates (SAST, DAST, SCA, secret scanning) throughout the pipeline, not as an afterthought."},
      {q:"What is the primary advantage of catching a vulnerability during SAST vs. finding it in production?",options:["It costs approximately the same either way","It costs approximately 10x less to fix it early in the pipeline","Production fixes are always easier and faster","Early catches don't significantly matter"],answer:1,explanation:"The cost of fixing security vulnerabilities grows exponentially the later they are discovered in the SDLC."},
      {q:"Which of the following best describes the DevSecOps formula?",options:["Speed + Automation","Speed + Automation + Security built-in at every stage","Security enforcement only at deployment","Manual security reviews only, no automation"],answer:1,explanation:"DevSecOps = Speed (DevOps velocity) + Automation + Security embedded and automated at every pipeline stage."},
      {q:"In a DevSecOps pipeline, what is the role of the `needs:` keyword in the docker-push job?",options:["It runs docker-push in parallel with all security checks","It blocks docker-push until ALL listed security jobs pass — acting as the security gate","It pushes the image to multiple registries simultaneously","It skips all previous job results"],answer:1,explanation:"needs: acts as a dependency gate — docker-push only runs after SAST, SCA, and container scans all pass successfully."},
      {q:"Which `on:` trigger makes a workflow reusable so it can be called from another workflow?",options:["on: push","on: workflow_dispatch","on: workflow_call","on: pull_request"],answer:2,explanation:"workflow_call enables other workflows to invoke this workflow as a reusable component, passing inputs and receiving outputs."},
      {q:"What does `secrets: inherit` do when used in a job that calls a reusable workflow?",options:["It creates new empty secrets for the child workflow","It passes all secrets from the parent workflow down to the child workflow","It deletes secrets after the job completes","It logs all secret values to the job console for debugging"],answer:1,explanation:"secrets: inherit forwards the caller's secrets to the reusable workflow without explicitly listing each one."},
      {q:"Which jobs should typically use `secrets: inherit`?",options:["Every job in the pipeline including simple linting","Only jobs that require authentication (e.g. Docker push, SonarQube scan)","No jobs — secrets: inherit is deprecated","Only the final deploy job"],answer:1,explanation:"Apply least privilege — only jobs that actually need credentials should inherit secrets to minimise exposure."},
      {q:"Which security scanning type analyses source code WITHOUT executing it?",options:["DAST — Dynamic Application Security Testing","SAST — Static Application Security Testing","SCA — Software Composition Analysis","Container Scanning"],answer:1,explanation:"SAST analyses code statically — finding vulnerabilities in source code without running the application at all."},
      {q:"Which of the following is a SAST tool specifically for Python code?",options:["Trivy","Bandit","GitLeaks","OWASP ZAP"],answer:1,explanation:"Bandit is a Python SAST tool that finds common security issues like hardcoded passwords, SQL injection, and insecure functions."},
      {q:"In a `code-quality.yml` workflow, what does `go vet` do?",options:["It formats Go source code","It performs static analysis to detect suspicious constructs and bugs in Go code","It runs Go unit tests","It builds the Go binary"],answer:1,explanation:"go vet analyses Go source code for suspicious constructs that are likely bugs — it complements linters like golangci-lint."},
      {q:"Which tool goes beyond basic linting and reports code smells, security hotspots, duplication percentage, and maintainability ratings?",options:["ESLint","flake8","SonarQube","hadolint"],answer:2,explanation:"SonarQube provides comprehensive code quality analysis — security, bugs, code smells, coverage, and duplication metrics."},
      {q:"When does SAST typically run in a DevSecOps pipeline?",options:["After deployment to production","During runtime of the application","On every push or pull request, in parallel with other CI checks","Only once a week via a scheduled trigger"],answer:2,explanation:"SAST runs on every push/PR — fast static analysis provides immediate developer feedback without blocking other checks."},
      {q:"What does SCA (Software Composition Analysis) scan for?",options:["Hardcoded passwords in the application's own source code","Known vulnerabilities (CVEs) in third-party libraries and open-source packages","Runtime behaviour of the application under load","Dockerfile syntax and best practices"],answer:1,explanation:"SCA scans dependency manifests (requirements.txt, go.mod, package.json) against CVE databases for vulnerable packages."},
      {q:"Which Go tool is used for vulnerability scanning of Go module dependencies in the pipeline?",options:["go fmt","govulncheck","go build","go run"],answer:1,explanation:"govulncheck scans Go modules against the Go vulnerability database (vuln.go.dev) to find affected packages with usage analysis."},
      {q:"In a `dependency-scan.yml` workflow, what is the purpose of `continue-on-error: true`?",options:["The job will fail silently without any notification","Even if vulnerabilities are found, the job reports them without failing the overall pipeline","The job skips the scan entirely if dependencies are missing","The job runs indefinitely in a retry loop"],answer:1,explanation:"continue-on-error: true lets the pipeline continue even if vulnerabilities are detected — useful for report-only audit mode."},
      {q:"Why is the `if: always()` condition used on the artifact upload step in a dependency scan?",options:["To ensure the scan report is uploaded even if a prior step in the job failed","To make the upload run faster","To prevent the upload from running unless the job succeeds","To trigger the next dependent workflow"],answer:0,explanation:"always() ensures the step runs regardless of previous step outcomes — critical for uploading failure/vulnerability reports."},
      {q:"What does hadolint check?",options:["Running containers for runtime vulnerabilities","Dockerfile syntax and best practices (like using COPY over ADD, adding USER, etc.)","Go source code for static bugs","Git commit history for leaked secrets"],answer:1,explanation:"hadolint lints Dockerfiles against Dockerfile best practices, integrating ShellCheck for RUN commands."},
      {q:"What is the purpose of the matrix strategy (`matrix: folders: [backend, frontend]`) in a Docker scan workflow?",options:["To run the scan once combining both folders","To run the same scan job twice — once for backend and once for frontend — in parallel","To deploy both service folders simultaneously","To merge both folders into a single Docker image"],answer:1,explanation:"Matrix strategy fans out — each matrix value runs as a separate parallel job with the same workflow definition."},
      {q:"In a Trivy scanner step, what does `severity: CRITICAL` specify?",options:["Only CRITICAL severity vulnerabilities will be reported and used for gating","All vulnerabilities will be re-classified as CRITICAL","CRITICAL vulnerabilities will be silently ignored","The scan only checks for CRITICAL-level malware"],answer:0,explanation:"The severity filter limits Trivy output to specified levels — CRITICAL (and HIGH) are typically the pipeline-blocking thresholds."},
      {q:"What is the effect of `ignore-unfixed: true` in the Trivy configuration?",options:["Vulnerabilities without an available patch are ignored, reducing alert noise","All vulnerabilities are ignored regardless of severity","Only unfixed vulnerabilities are reported; fixed ones are ignored","The scan skips all checks and runs faster"],answer:0,explanation:"ignore-unfixed filters out CVEs with no available fix — focusing developer attention on actionable, patchable findings."},
      {q:"What does `exit-code: 1` do in the Trivy action configuration?",options:["It always exits with code 1 regardless of findings","It tells Trivy to return a non-zero exit code when vulnerabilities matching the severity threshold are found, failing the CI step","It forces the runner VM to restart","It disables all scan output and logs"],answer:1,explanation:"exit-code: 1 makes the CI step fail when Trivy finds matching vulnerabilities — this enforces the security quality gate."},
      {q:"What is the purpose of `fail-fast: false` in the Docker scan matrix strategy?",options:["If one folder scan fails, the other folder scan continues independently to completion","The entire workflow fails immediately on any matrix job error","No matrix jobs run in parallel; they run sequentially","The entire build is cancelled on first failure"],answer:0,explanation:"fail-fast: false lets all matrix jobs complete even if one fails — you get full scan results for all services."},
      {q:"Why does the GitLeaks scan use `fetch-depth: 0` when checking out the repository?",options:["To speed up the checkout process by fetching fewer commits","To download the complete Git history, since a secret may have been committed then deleted","To only fetch the very latest commit","To disable all Git history operations"],answer:1,explanation:"GitLeaks scans the full git history — secrets removed in later commits are still detectable in earlier commits."},
      {q:"How does GitLeaks detect secrets in source code?",options:["By running the application and monitoring all network traffic","By using regex pattern matching and entropy-based detection against known secret signatures","By asking developers to manually flag secrets in code comments","By checking only the Dockerfile and CI YAML files"],answer:1,explanation:"GitLeaks uses regex rules for known secret patterns (AWS keys, GitHub tokens, private keys) and entropy analysis for random strings."},
      {q:"Which of the following would GitLeaks be able to detect?",options:["Python syntax errors","AWS access keys accidentally committed to a repository","Docker image layer sizes","Unit test coverage percentage"],answer:1,explanation:"GitLeaks detects accidentally committed credentials — AWS keys, GitHub tokens, private keys, Stripe keys, and API secrets."},
      {q:"What does OWASP ZAP Baseline Scan test against?",options:["Source code without executing it","The running application against the OWASP Top 10 web security risks","Docker images for known CVEs in OS packages","Git commit history for leaked credentials"],answer:1,explanation:"OWASP ZAP performs DAST — it sends actual HTTP requests to a live application and tests for real-world web vulnerabilities."},
      {q:"Why does the DAST scan run AFTER deployment, not before?",options:["Because DAST requires the application to be live and running to simulate real HTTP attacks","Because DAST only runs on weekends due to infrastructure costs","Because DAST is faster and more efficient when the app is fully deployed","Because DAST completely replaces all other security scanning types"],answer:0,explanation:"DAST (Dynamic testing) needs a running target — it cannot test an application that has not been deployed yet."},
      {q:"In a production DevSecOps pipeline, which severity levels should BLOCK the build from proceeding?",options:["All severities including LOW and MEDIUM","CRITICAL and HIGH","Only CRITICAL — HIGH can be ignored and tracked","None — all findings should only be reported, never blocking"],answer:1,explanation:"CRITICAL and HIGH severity findings block the pipeline. MEDIUM/LOW are tracked in reports but are typically non-blocking."},
      {q:"What is the correct order of stages in a DevSecOps pipeline dependency chain?",options:["deploy → docker-push → dast-scan → CI checks (parallel)","CI checks (parallel) → docker-push → deploy → dast-scan","dast-scan → CI checks → docker-push → deploy","docker-push → CI checks → deploy → dast-scan"],answer:1,explanation:"Security gates are ordered: all CI/security checks pass in parallel → docker-push → deploy → DAST tests the live application."}
    ]
  },
  M10: {
    title: "Kubernetes",
    questions: [
      {q:"Which component acts as the main entry point for the Kubernetes API?",options:["kubelet","kube-scheduler","etcd","kube-apiserver"],answer:3,explanation:"kube-apiserver is the front-end of the control plane — all kubectl commands and internal components communicate through it."},
      {q:"Where is the state of the Kubernetes cluster persisted?",options:["kube-controller-manager","etcd","kube-proxy","containerd"],answer:1,explanation:"etcd is a distributed key-value store that holds the entire cluster state. It is the single source of truth."},
      {q:"What is the primary role of the kube-scheduler?",options:["To monitor container CPU utilisation","To assign Pods to healthy Worker Nodes based on resource constraints and policies","To restart crashed containers","To configure iptables rules on nodes"],answer:1,explanation:"The scheduler watches for unscheduled Pods and assigns them to nodes based on resources, taints, tolerations, and affinity."},
      {q:"Which agent runs on worker nodes to monitor container state and communicate with the API server?",options:["kube-proxy","etcd","kubelet","containerd"],answer:2,explanation:"kubelet runs on every node — it ensures containers described in PodSpecs are running and healthy, reporting back to the API server."},
      {q:"What is the smallest deployable unit of execution in Kubernetes?",options:["Container","Service","Pod","Deployment"],answer:2,explanation:"A Pod wraps one or more tightly coupled containers that share a network namespace and storage volumes."},
      {q:"How do multiple containers inside the same Pod share networking?",options:["They communicate over separate network interfaces","They communicate via localhost because they share the same network namespace","They must use external load balancers","They cannot share networking resources"],answer:1,explanation:"Containers in a Pod share the same network namespace — they see each other on localhost with different port numbers."},
      {q:"What is the default namespace where K8s objects are created if none is specified?",options:["kube-system","kube-public","default","home"],answer:2,explanation:"Objects created without a namespace go to 'default'. kube-system is reserved for system components like CoreDNS."},
      {q:"Which K8s resource manages ReplicaSets and automates rolling updates for stateless applications?",options:["DaemonSet","StatefulSet","Job","Deployment"],answer:3,explanation:"Deployments manage ReplicaSets and orchestrate rolling updates, rollbacks, and scaling of stateless application workloads."},
      {q:"If a bare Pod (without a controller) crashes, what happens?",options:["Kubelet restarts it automatically on another node","The Deployment controller recreates it","The Pod is gone forever and is not rescheduled","kube-scheduler waits 5 minutes before rescheduling it"],answer:2,explanation:"Bare Pods have no controller watching them — if they crash or the node fails, they are not rescheduled anywhere."},
      {q:"Which command rolls back a Deployment to its previous stable revision?",options:["kubectl rollback deployment","kubectl rollout undo deployment","kubectl delete deployment","kubectl apply deployment"],answer:1,explanation:"kubectl rollout undo deployment/<name> reverts to the previous ReplicaSet revision stored in the Deployment's rollout history."},
      {q:"What is the default Service type in Kubernetes?",options:["NodePort","LoadBalancer","ClusterIP","ExternalName"],answer:2,explanation:"ClusterIP exposes the Service on a cluster-internal IP — accessible only within the cluster, not from outside."},
      {q:"Which component provides internal DNS resolution inside a Kubernetes cluster?",options:["CoreDNS","kube-proxy","etcd","containerd"],answer:0,explanation:"CoreDNS runs as a Deployment in kube-system and resolves service names to ClusterIPs for all Pods in the cluster."},
      {q:"How does the Gateway API differ from legacy Ingress?",options:["It is slower and less secure than Ingress","It splits routing and load balancing into separate role-oriented resources (Gateway, HTTPRoute, etc.)","It is hosted outside the cluster only","It only supports raw TCP traffic"],answer:1,explanation:"Gateway API is the next-generation replacement for Ingress with role-oriented resources and much richer routing capabilities."},
      {q:"How are values stored inside a standard Kubernetes Secret manifest?",options:["Encrypted using AES-256 by default","Base64 encoded (not encrypted by default)","Rotated automatically by etcd","As clear-text plaintext"],answer:1,explanation:"Secrets store data as base64-encoded strings — NOT encrypted by default. Encryption at rest requires additional etcd configuration."},
      {q:"What happens to env vars in a running Pod if you update the source ConfigMap?",options:["They update instantly and live inside the running container","They are deleted from the running container","They only update after a Pod restart or recreation","The Pod crashes immediately upon ConfigMap change"],answer:2,explanation:"Env vars from ConfigMaps are injected at Pod creation time. Changes to ConfigMaps require Pod restart to take effect."},
      {q:"Which resource represents a developer's request for persistent storage in a cluster?",options:["PersistentVolume (PV)","StorageClass","PersistentVolumeClaim (PVC)","ConfigMap"],answer:2,explanation:"PVCs are requests for storage — the cluster binds them to matching PVs or dynamically provisions one via StorageClass."},
      {q:"Which reclaim policy ensures the Persistent Volume remains after the PVC is deleted?",options:["Delete","Recycle","Retain","Archive"],answer:2,explanation:"Retain keeps the PV and its data after PVC deletion — an admin must manually decide what to do with the data."},
      {q:"What is the advantage of using a StorageClass in Kubernetes?",options:["It encrypts all database configurations","It enables dynamic provisioning of storage on-demand when a PVC is created","It speeds up Pod scheduling decisions","It monitors application log directories"],answer:1,explanation:"StorageClass abstracts storage backends (EBS, GCS, NFS) and enables dynamic PV provisioning on PVC creation."},
      {q:"Which controller is best suited for running stateful databases requiring stable, sticky identities?",options:["Deployment","DaemonSet","StatefulSet","Job"],answer:2,explanation:"StatefulSets provide stable network identities, ordered deployment, and persistent storage — designed for stateful workloads like databases."},
      {q:"Which controller ensures exactly one copy of a specific Pod runs on every single worker node?",options:["ReplicaSet","StatefulSet","Job","DaemonSet"],answer:3,explanation:"DaemonSets run exactly one Pod per node — used for log collectors (Fluentd), monitoring agents (Node Exporter), and CNI plugins."},
      {q:"When does a Job controller terminate after creating its Pods?",options:["When the schedule time is met","Once the task runs to the configured number of successful completions","It runs indefinitely until manually deleted","When the node running the Pod goes offline"],answer:1,explanation:"Jobs run to completion — they terminate when the specified number of successful Pod completions is reached."},
      {q:"What probe does Kubelet use to detect a deadlocked container that needs to be restarted?",options:["Readiness Probe","Liveness Probe","Startup Probe","Healthy Probe"],answer:1,explanation:"Liveness probes detect stuck or deadlocked containers — kubelet restarts the container when the liveness probe fails."},
      {q:"Which probe temporarily removes a Pod from Service endpoints when it fails?",options:["Liveness Probe","Startup Probe","Readiness Probe","Eviction Probe"],answer:2,explanation:"Readiness probes control traffic routing — a failing Pod is removed from Service endpoints until the probe recovers."},
      {q:"A Pod is terminated with Exit Code 137. What does this mean?",options:["It was throttled due to CPU rate limiting","It was OOMKilled (Out Of Memory) for exceeding its configured memory limit","It exited successfully after completing its task","It had an unrecoverable network timeout"],answer:1,explanation:"Exit 137 = 128 + SIGKILL (9). The Linux OOM killer sent SIGKILL to the container for exceeding its memory limit."},
      {q:"Which QoS class does a Pod receive if its container has requests.cpu=100m and limits.cpu=200m (not equal)?",options:["Guaranteed","Burstable","BestEffort","Priority"],answer:1,explanation:"Burstable: requests and limits are set but not equal. Guaranteed: requests exactly equal limits. BestEffort: neither set."},
      {q:"What is required to make a Horizontal Pod Autoscaler (HPA) function?",options:["A legacy Ingress controller","Persistent Volume claims for each Pod","Metrics Server active in the cluster and resource requests defined on Pods","A service mesh like Istio"],answer:2,explanation:"HPA queries Metrics Server for CPU/memory metrics — without it, HPA cannot make any scaling decisions."},
      {q:"What is applied to Nodes to repel Pods unless the Pod has a matching toleration?",options:["Labels","Taints","Tolerations","Selectors"],answer:1,explanation:"Taints mark nodes as unsuitable for general scheduling. Only Pods with matching Tolerations can be placed on them."},
      {q:"How do you define a soft scheduling preference for Pods to land on nodes with SSDs?",options:["requiredDuringSchedulingIgnoredDuringExecution Node Affinity","Taints and Tolerations","preferredDuringSchedulingIgnoredDuringExecution Node Affinity","DaemonSet configuration"],answer:2,explanation:"preferredDuring... is a soft preference — the scheduler tries to honour it but will schedule elsewhere if no matching nodes exist."},
      {q:"What is Helm in the context of Kubernetes?",options:["A container runtime engine","A package manager that bundles and configures Kubernetes YAML manifests as reusable Charts","A cluster monitoring dashboard","An internal network overlay CNI plugin"],answer:1,explanation:"Helm is the package manager for Kubernetes — Charts bundle all application manifests with configurable values.yaml defaults."},
      {q:"Which Helm file contains the customisable input parameters that overwrite default values?",options:["Chart.yaml","templates/service.yaml","values.yaml","Release.json"],answer:2,explanation:"values.yaml holds default configuration values. Override with `-f custom.yaml` or `--set key=value` at install or upgrade time."}
    ]
  }

// ── State ────────────────────────────────────────────────────────────────────
let currentModule = null;
let moduleData    = null;
let questions     = [];
let currentIndex  = 0;
let score         = 0;
let answered      = false;

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  const params = new URLSearchParams(window.location.search);
  currentModule = (params.get('module') || '').toUpperCase();

  if (!QUIZ_DATA[currentModule]) {
    document.getElementById('errorScreen').classList.add('visible');
    return;
  }

  moduleData = QUIZ_DATA[currentModule];
  questions  = shuffle([...moduleData.questions]);

  document.getElementById('quizArea').classList.add('visible');
  document.getElementById('moduleEyebrow').textContent = currentModule + ' Mastery Exam';
  document.getElementById('moduleTitle').textContent   = moduleData.title;
  document.getElementById('moduleSubtitle').textContent =
    questions.length + ' questions \u2022 Multiple choice \u2022 One at a time';

  const best = localStorage.getItem('devops90_quiz_best_' + currentModule);
  if (best !== null) {
    const badge = document.getElementById('bestScoreBadge');
    badge.textContent = 'Best: ' + best + '/' + questions.length;
    badge.classList.add('visible');
  }

  renderQuestion();
}

// ── Shuffle ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── Render question ───────────────────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q     = questions[currentIndex];
  const total = questions.length;

  const pct = (currentIndex / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFraction').textContent = (currentIndex + 1) + ' / ' + total;
  document.getElementById('questionNumber').textContent = 'Question ' + (currentIndex + 1);
  document.getElementById('questionText').textContent   = q.q;

  const list    = document.getElementById('optionsList');
  const letters = ['A','B','C','D'];
  list.innerHTML = '';
  q.options.forEach(function(opt, i) {
    const li  = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.setAttribute('data-index', i);
    btn.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', function() { selectAnswer(i); });
    li.appendChild(btn);
    list.appendChild(li);
  });

  document.getElementById('explanationBox').classList.remove('visible');
  document.getElementById('explanationText').textContent = '';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.remove('visible');
  nextBtn.textContent = (currentIndex + 1 >= total) ? 'See Results \u2192' : 'Next Question \u2192';
}

// ── Handle answer ─────────────────────────────────────────────────────────────
function selectAnswer(selectedIdx) {
  if (answered) return;
  answered = true;

  const q       = questions[currentIndex];
  const correct = q.answer;
  const btns    = document.querySelectorAll('.option-btn');

  btns.forEach(function(btn) {
    btn.disabled = true;
    const idx = parseInt(btn.getAttribute('data-index'));
    if (idx === correct)      btn.classList.add('correct');
    else if (idx === selectedIdx) btn.classList.add('wrong');
  });

  if (selectedIdx === correct) score++;

  const expBox = document.getElementById('explanationBox');
  const expTxt = document.getElementById('explanationText');
  const letters = ['A','B','C','D'];
  expTxt.textContent = q.explanation
    ? q.explanation
    : 'Correct answer: ' + letters[correct] + '. ' + q.options[correct];
  expBox.classList.add('visible');
  document.getElementById('nextBtn').classList.add('visible');
}

// ── Next question ─────────────────────────────────────────────────────────────
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) showScore();
  else renderQuestion();
}

// ── Score screen ──────────────────────────────────────────────────────────────
function showScore() {
  document.getElementById('questionCard').style.display    = 'none';
  document.getElementById('nextBtn').style.display         = 'none';
  document.getElementById('progressContainer').style.display = 'none';

  const total = questions.length;
  const pct   = Math.round((score / total) * 100);

  const key  = 'devops90_quiz_best_' + currentModule;
  const prev = parseInt(localStorage.getItem(key) || '0');
  if (score > prev) {
    localStorage.setItem(key, score);
    const badge = document.getElementById('bestScoreBadge');
    badge.textContent = 'Best: ' + score + '/' + total;
    badge.classList.add('visible');
  }

  document.getElementById('scoreCircle').style.setProperty('--pct', pct);
  document.getElementById('scoreNumber').textContent = score + '/' + total;

  let title, sub;
  if      (pct >= 90) { title = 'Outstanding!';   sub = 'You have mastered this module.'; }
  else if (pct >= 75) { title = 'Great Work!';     sub = 'Strong understanding — almost perfect.'; }
  else if (pct >= 60) { title = 'Good Effort!';    sub = 'Solid foundation — review and retry.'; }
  else if (pct >= 40) { title = 'Keep Going!';     sub = 'Review the material and try again.'; }
  else                { title = 'Keep Studying!';  sub = 'Revisit the module content and retry.'; }
  document.getElementById('scoreTitle').textContent    = title;
  document.getElementById('scoreSubtitle').textContent = sub;

  let pMsg;
  if      (pct >= 90) pMsg = 'Top 5% — You crushed it! Share your achievement.';
  else if (pct >= 80) pMsg = 'Top 20% — Excellent performance!';
  else if (pct >= 70) pMsg = 'Top 35% — Well above average!';
  else if (pct >= 60) pMsg = 'Above average — keep pushing!';
  else                pMsg = 'Keep studying — you\'ve got this!';
  document.getElementById('percentileMsg').textContent = pMsg;

  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent   = total - score;
  document.getElementById('statPct').textContent     = pct + '%';

  const shareText =
    'I just scored ' + score + '/' + total + ' (' + pct + '%) on the ' +
    moduleData.title + ' mastery quiz in #LearnDevOpsIn90Days! ' +
    'Building real DevOps skills one module at a time.' +
    '\n\n#DevOps #DevOpsEngineer #100DaysOfCode';
  const pageUrl = 'https://aryashreepritikrishna.github.io/learn-devops-in-90-days/quiz.html?module=' + currentModule;
  const liUrl   = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(pageUrl) +
                  '&summary=' + encodeURIComponent(shareText);
  document.getElementById('linkedinBtn').href = liUrl;

  document.getElementById('scoreScreen').classList.add('visible');
}

// ── Retake ─────────────────────────────────────────────────────────────────────
function retakeQuiz() {
  score        = 0;
  currentIndex = 0;
  answered     = false;
  questions    = shuffle([...moduleData.questions]);

  document.getElementById('questionCard').style.display    = '';
  document.getElementById('progressContainer').style.display = '';
  document.getElementById('scoreScreen').classList.remove('visible');

  renderQuestion();
}

init();
</script>
